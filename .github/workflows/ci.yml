# Tests, then a multi-arch image on ghcr.io/<owner>/<repo>:
#   main -> :main and :sha-xxxxxxx; pull requests build without pushing.
#   tag v1.2.3 -> no new build: the :sha-xxxxxxx image main built for that commit gets :1.2.3, :1.2 and :latest.
# Each architecture builds on a native runner (no QEMU: an emulated release build with fat LTO takes ages).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -yq fonts-liberation fonts-dejavu-core poppler-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
        env:
          FONTS_DIR: /usr/share/fonts

  build:
    if: github.ref_type != 'tag'
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - run: echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ env.ARCH }}
          cache-to: type=gha,scope=${{ env.ARCH }},mode=max
      # smoke test: the image starts and renders a PDF
      - if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: pdfrs:test
          cache-from: type=gha,scope=${{ env.ARCH }}
      - if: github.event_name == 'pull_request'
        run: |
          docker run -d --name pdfrs -p 3000:3000 pdfrs:test
          for i in $(seq 20); do curl -sf localhost:3000/health && break; sleep 0.5; done
          curl -sf --data-binary @demo/report.html localhost:3000/ -o report.pdf
          head -c 5 report.pdf | grep -q '%PDF-'
      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.ARCH }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"

  # a release tag: the image of its commit, built by the main run (pushed with the tag, it may still be building)
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Wait for the image of the commit
        run: |
          SOURCE="$IMAGE:sha-${GITHUB_SHA::7}"
          for i in $(seq 70); do
            docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1 && exit 0
            echo "waiting for $SOURCE (the main run of this commit)…"
            sleep 30
          done
          echo "::error::$SOURCE not found: push the commit to main (and let its run succeed) before tagging it"
          exit 1
      - run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") "$IMAGE:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
